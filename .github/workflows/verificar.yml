name: Verifica o código

on: [push, pulll_request]

jobs:
   verificar:
      runs-on: ubuntu-latest
      steps:
        - name: Baicar o código 
          uses: actions/checkout@v4
        - name: Configurar Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - name: Verificar sintaze do agenda.py
          run: python -m py_compile agenda.py